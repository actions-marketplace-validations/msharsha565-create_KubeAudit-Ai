# KA007: credentials inside connection-string URLs.
apiVersion: v1
kind: Pod
metadata:
  name: url-creds
spec:
  containers:
    - name: app
      image: node:22.11.0
      env:
        - name: DATABASE_URL
          value: postgres://orders:s3cr3t@postgres:5432/orders
        - name: REDIS_URL
          value: redis://:hunter2@redis:6379/0
        - name: SAFE_URL
          value: postgres://orders:$(DB_PASSWORD)@postgres:5432/orders
        - name: USER_ONLY_URL
          value: postgres://orders@postgres:5432/orders
        - name: PLAIN_URL
          value: https://example.com/path
        - name: AT_IN_PATH
          value: https://example.com/users/@me
