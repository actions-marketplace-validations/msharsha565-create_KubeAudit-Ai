apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kubeaudit-validating-webhook
webhooks:
  - name: kubeaudit.local.validator
    rules:
      - apiGroups: ["", "apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "deployments", "statefulsets", "daemonsets"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: kubeaudit-service
        namespace: kubeaudit
        path: "/validate"
        port: 443
      caBundle: 
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Fail
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kubeaudit"]
