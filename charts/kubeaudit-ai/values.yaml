replicaCount: 1

image:
  repository: kubeaudit-ai
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 443
  targetPort: 8443

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

webhook:
  failurePolicy: Fail
  caBundle: ""
