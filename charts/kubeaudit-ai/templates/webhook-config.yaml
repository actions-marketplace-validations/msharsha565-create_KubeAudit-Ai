apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Release.Name }}-validating-webhook
webhooks:
  - name: {{ .Release.Name }}.local.validator
    rules:
      - apiGroups: ["", "apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "deployments", "statefulsets", "daemonsets"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: {{ .Release.Name }}-service
        namespace: {{ .Release.Namespace }}
        path: "/validate"
        port: {{ .Values.service.port }}
      caBundle: {{ .Values.webhook.caBundle | quote }}
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", {{ .Release.Namespace | quote }}]
