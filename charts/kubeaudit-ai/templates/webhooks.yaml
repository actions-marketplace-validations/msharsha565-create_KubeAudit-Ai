{{- $certs := include "kubeaudit-ai.certs" . | fromYaml }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kubeaudit-ai.fullname" . }}-mutator
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
webhooks:
  - name: mutate.kubeaudit.ai
    clientConfig:
      service:
        name: {{ include "kubeaudit-ai.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
      caBundle: {{ $certs.caCrt }}
    rules:
      - operations: ["CREATE"]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["pods"]
        scope: "Namespaced"
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 2
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kubeaudit
