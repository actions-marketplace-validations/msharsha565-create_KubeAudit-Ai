{{- $secretName := printf "%s-tls" (include "kubeaudit-ai.fullname" .) }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $caBundle := "" }}
{{- if and $secret $secret.data }}
  {{- $caBundle = index $secret.data "ca.crt" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kubeaudit-ai.fullname" . }}-mutator
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
webhooks:
  - name: mutate.kubeaudit.ai
    clientConfig:
      service:
        name: {{ include "kubeaudit-ai.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
        port: 443
      caBundle: {{ $caBundle | default "Cg==" }}
    rules:
      - operations: ["CREATE"]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["pods"]
        scope: "Namespaced"
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 2
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kubeaudit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "kubeaudit-ai.fullname" . }}-validator
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
webhooks:
  - name: audit.kubeaudit.ai
    clientConfig:
      service:
        name: {{ include "kubeaudit-ai.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: "/validate"
        port: 443
      caBundle: {{ $caBundle | default "Cg==" }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["pods"]
        scope: "Namespaced"
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 2
    failurePolicy: Ignore
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kubeaudit
