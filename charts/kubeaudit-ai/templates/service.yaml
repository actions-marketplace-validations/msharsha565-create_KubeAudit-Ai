apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeaudit-ai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
    app: {{ include "kubeaudit-ai.name" . }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app: {{ include "kubeaudit-ai.name" . }}
