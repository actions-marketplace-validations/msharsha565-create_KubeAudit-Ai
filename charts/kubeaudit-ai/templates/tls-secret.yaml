{{- if .Values.tls.autoGenerate }}
{{- $certs := include "kubeaudit-ai.gen-certs" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeaudit-ai.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $certs.tlsCrt }}
  tls.key: {{ $certs.tlsKey }}
{{- end }}
