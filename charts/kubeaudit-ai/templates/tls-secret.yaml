{{- if .Values.tls.autoGenerate }}
{{- $secretName := printf "%s-tls" (include "kubeaudit-ai.fullname" .) }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $serviceName := printf "%s.%s.svc" (include "kubeaudit-ai.fullname" .) .Release.Namespace }}
{{- $altNames := list $serviceName (printf "%s.%s.svc.cluster.local" (include "kubeaudit-ai.fullname" .) .Release.Namespace) }}
{{- $ca := "" }}
{{- $cert := "" }}
{{- if and $secret $secret.data }}
{{- $caCrt := index $secret.data "ca.crt" }}
{{- $tlsCrt := index $secret.data "tls.crt" }}
{{- $tlsKey := index $secret.data "tls.key" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCrt }}
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
{{- else }}
{{- $ca = genCA "kubeaudit-ca" 3650 }}
{{- $cert = genSignedCert $serviceName nil $altNames 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
