{{- if .Values.tls.autoGenerate }}
{{- $cn := printf "%s.%s.svc" (include "kubeaudit-ai.fullname" .) .Release.Namespace }}
{{- $ca := genCA "kubeaudit-ca" 3650 }}
{{- $cert := genSignedCert $cn nil (list $cn (printf "%s.%s.svc.cluster.local" (include "kubeaudit-ai.fullname" .) .Release.Namespace)) 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeaudit-ai.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kubeaudit-ai.name" . }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
